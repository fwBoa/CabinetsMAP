# .github/workflows/test-admin.yml
# Lance les tests E2E admin (lecture seule) a chaque PR/push.
# En lecture seule : aucune mutation GitHub, aucune PR creee.

name: Tests E2E admin

on:
  push:
    branches: [main, security/**]
  pull_request:
    branches: [main]

jobs:
  test-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # npm ci exige un lockfile. Si absent ou corrompu, fallback sur npm install.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "⚠ package-lock.json absent, fallback sur npm install"
            npm install --no-audit --no-fund
          fi

      - name: Run E2E tests (read-only)
        env:
          BASE_URL: https://cabinetsmap.vercel.app
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
        run: npm run test:read-only

      # NOTE : les tests avec mutations (edit/add/delete) ne tournent PAS en CI.
      # Raison : ils creent de vraies PRs sur GitHub et le cleanup necessite
      # un gh CLI authentifie (GH_TOKEN). A activer manuellement en local
      # pour valider un changement avant de merger, ou apres avoir ajoute
      # GITHUB_TOKEN aux secrets du runner.
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   env:
      #     BASE_URL: https://cabinetsmap.vercel.app
      #     ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
      #   run: npm test
      #   continue-on-error: false
