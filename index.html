<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CabinetsMAP - Redirection</title>
  <meta http-equiv="refresh" content="0; url=https://cabinetsmap.vercel.app/">
  <link rel="canonical" href="https://cabinetsmap.vercel.app/">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #1a202c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="spinner" aria-hidden="true"></div>
  <h1>CabinetsMAP</h1>
  <p>Redirection vers le site principal...</p>
  <p>
    Si la redirection ne fonctionne pas automatiquement,
    <a href="https://cabinetsmap.vercel.app/">cliquez ici</a>.
  </p>
  <script>
    // Fallback JS au cas ou la meta refresh est bloquee
    window.location.replace('https://cabinetsmap.vercel.app/' + window.location.pathname.replace(/^\/CabinetsMAP/, '') + window.location.search);
  </script>
</body>
</html>
