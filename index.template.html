<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="description" content="Réseau avocat CEGC — 13 cabinets d'avocats partenaires couvrant 103 départements en France métropolitaine et outre-mer." />
  <title>Réseau avocat CEGC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231e3a8a'/%3E%3Ctext x='50' y='64' text-anchor='middle' font-family='Georgia' font-size='40' font-weight='700' fill='%23fff'%3ECEGC%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a href="#main" class="skip-link">Aller au contenu principal</a>

  <div class="splash" id="loader" role="status" aria-live="polite" aria-label="Chargement du réseau">
    <div class="splash__inner">
      <p class="splash__title">Réseau avocat <span class="splash__brand">CEGC</span></p>
      <div class="splash__spinner" aria-hidden="true"></div>
      <p class="splash__subtitle" id="loaderText">Préparation du réseau…</p>
    </div>
    <div class="splash__actions" id="loaderActions" style="display:none;">
      <button class="btn btn--primary" id="retryBtn" type="button">Réessayer</button>
      <button class="btn" id="continueBtn" type="button">Continuer sans carte</button>
    </div>
  </div>

  <header class="map-header">
    <div class="header__actions">
      <button class="icon-btn om-trigger" id="omTrigger" type="button" aria-label="Centrer sur les DOM-TOM-COM" title="DOM-TOM-COM">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M2 12h20" />
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
        </svg>
      </button>
      <button class="icon-btn" id="resetViewBtn" type="button" aria-label="Réinitialiser la vue" title="Réinitialiser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="3 11 22 2 13 21 11 13 3 11" />
        </svg>
      </button>
      <button class="icon-btn menu-toggle" id="menuToggle" type="button" aria-label="Ouvrir la liste" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="6" x2="20" y2="6" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <line x1="4" y1="18" x2="20" y2="18" />
        </svg>
      </button>
    </div>
  </header>

  <main id="main" class="map-main">
    <div id="map" role="region" aria-label="Carte interactive de couverture territoriale du réseau" tabindex="-1"></div>
    <div class="om-inset" id="omInset" aria-label="DOM-TOM-COM">
      <span class="om-inset__label" id="omInsetLabel">DOM-TOM-COM</span>
      <div class="om-inset__chips" id="omInsetChips" hidden></div>
    </div>
    <p class="map-disclaimer" id="mapDisclaimer" aria-label="Note sur la représentation cartographique">
      Représentation schématique — proportions non respectées
    </p>
  </main>

  <!-- Sidebar / mobile bottom sheet -->
  <aside class="sidebar sidebar--closed" id="sidebar" aria-label="Liste des cabinets">
    <div class="sidebar__handle" id="sidebarHandle" aria-label="Ouvrir ou fermer la liste" role="button" tabindex="0">
      <span class="sidebar__handle-bar" aria-hidden="true"></span>
      <span class="sidebar__handle-label" aria-hidden="true">Cabinets</span>
    </div>

    <div class="sidebar__header">
      <h2 class="sidebar__title">Nos cabinets partenaires</h2>
      <div class="sidebar__kpis">
        <span class="sidebar__kpi"><strong id="sidebarKpiCabinets">13</strong> cabinets</span>
        <span class="sidebar__kpi"><strong id="sidebarKpiDepts">103</strong> départements</span>
      </div>
      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <label class="sr-only" for="searchInput">Rechercher un cabinet ou un département</label>
        <input class="search__input" id="searchInput" type="search" placeholder="Cabinet, ville ou département…" autocomplete="off" inputmode="search" />
        <button class="search__clear" id="searchClear" type="button" aria-label="Effacer" title="Effacer" hidden>×</button>
      </div>
    </div>

    <div class="sidebar__toolbar">
      <span class="sidebar__count" id="resultCount" aria-live="polite"></span>
      <button class="sidebar__reset" id="resetFiltersBtn" type="button" hidden>Tout effacer</button>
    </div>

    <div class="sidebar__om-chips" id="sidebarOmChips" hidden></div>

    <ul class="sidebar__list" id="cabinetList" role="list"></ul>

    <div class="sidebar__legend" id="cabinetLegend"></div>

    <!-- Mobile-only detail view inside the sheet -->
    <div class="sheet-detail" id="sheetDetailView" hidden aria-label="Détails du cabinet">
      <div class="sheet-detail__header">
        <button class="sheet-detail__back" id="sheetDetailBack" type="button" aria-label="Retour à la liste">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6" />
          </svg>
          Retour
        </button>
        <button class="sheet-detail__close" id="sheetDetailClose" type="button" aria-label="Fermer les détails">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="sheet-detail__body" id="sheetDetailBody"></div>
    </div>
  </aside>

  <!-- Detail panel -->
  <aside class="detail-panel detail-panel--hidden" id="detailPanel" aria-label="Détails du cabinet">
    <div class="detail-panel__handle" id="detailPanelHandle" aria-label="Agrandir ou fermer" role="button" tabindex="0">
      <span class="detail-panel__handle-bar" aria-hidden="true"></span>
    </div>
    <div class="detail-panel__header">
      <span class="detail-panel__avatar" id="detailAvatar" aria-hidden="true"></span>
      <div class="detail-panel__meta">
        <h2 class="detail-panel__title" id="detailTitle"></h2>
        <p class="detail-panel__subtitle" id="detailSubtitle"></p>
      </div>
      <button class="detail-panel__close" id="detailClose" type="button" aria-label="Fermer les détails">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <div class="detail-panel__body" id="detailBody"></div>
  </aside>

  <div id="ariaRegion" aria-live="polite" aria-atomic="true" class="sr-only"></div>
  <div id="mapTooltip" class="map-tooltip" role="status" aria-live="polite" aria-hidden="true"></div>
  <script src="assets/config.js"></script>
  <script src="assets/map.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
